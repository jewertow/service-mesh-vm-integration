apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __VM_NAME__
  labels:
    app: __VM_NAME__
spec:
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: __VM_NAME__-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: rhel9
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  runStrategy: RerunOnFailure
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: rhel9
        vm.kubevirt.io/workload: server
      labels:
        kubevirt.io/size: small
        # label used by the LoadBalancer service exposing the VM
        vm: __VM_NAME__
    spec:
      architecture: amd64
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              model: virtio
              # With masquerade networking only the listed ports are forwarded into the guest.
              # 22 is SSH, 8080 is the port the mesh sends inbound traffic to - the Istio
              # iptables rules in the guest redirect it to Envoy on 15006.
              ports:
                - port: 22
                - port: 8080
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
        memory:
          guest: 2Gi
      networks:
      - name: default
        pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
        - name: rootdisk
          dataVolume:
            name: __VM_NAME__-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: __VM_NAME__
              user: admin
              password: admin
              chpasswd:
                expire: False
              ssh_authorized_keys:
                - __SSH_PUBLIC_KEY__
