---
- name: Configure External VM
  hosts: istio_vms
  become: true

  roles:
  # istio_proxy_config_dir is set per host in the inventory - each VM joins the mesh
  # with its own generated configuration.
  - role: istio-proxy
  - role: httpbin

  tasks:
  - name: Install curl
    ansible.builtin.package:
      name: curl
      state: present
