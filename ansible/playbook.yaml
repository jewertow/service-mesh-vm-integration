---
- name: Deploy ztunnel to an external VM
  hosts: istio_vms
  become: true
  vars:
    work_dir: "{{ playbook_dir }}/../ztunnel-vm-config"
    ztunnel_image: "{{ lookup('env', 'ZTUNNEL_IMAGE') }}"
    ew_gateway_addr: "{{ lookup('env', 'EW_GATEWAY_ADDR') }}"
    vm_ip: "{{ lookup('env', 'VM_IP') }}"
    ztunnel_namespace: external-vm
    ztunnel_workload_name: vm-1
    ztunnel_service_account: vm
    ztunnel_cluster_id: Kubernetes
    ztunnel_network: vm-network

  tasks:
    - name: Fail fast on missing environment variables
      ansible.builtin.assert:
        that:
          - ztunnel_image | length > 0
          - ew_gateway_addr | length > 0
          - vm_ip | length > 0
        fail_msg: >-
          ZTUNNEL_IMAGE, EW_GATEWAY_ADDR and VM_IP must be exported before running
          this playbook. See README.md.

    # -------------------------------------------------------------------
    # 1. Docker Installation
    # -------------------------------------------------------------------
    - name: Add Docker CE repository
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        gpgcheck: false

    # containerd.io conflicts with the runc that ships with podman, hence allowerasing.
    - name: Install Docker packages
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        disable_gpg_check: true
        allowerasing: true

    # Required by the community.docker modules used below. Not packaged in
    # baseos/appstream, so it comes from pip.
    - name: Install pip
      ansible.builtin.dnf:
        name: python3-pip
        state: present

    - name: Install the Docker SDK for Python
      ansible.builtin.pip:
        name: docker
        state: present

    - name: Enable and start the Docker daemon
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # -------------------------------------------------------------------
    # 2. Transfer Configuration Files
    # -------------------------------------------------------------------
    - name: Create the ztunnel configuration directory
      ansible.builtin.file:
        path: /etc/ztunnel
        state: directory
        mode: '0755'

    - name: Deploy root certificate
      ansible.builtin.copy:
        src: "{{ work_dir }}/root-cert.pem"
        dest: /etc/ztunnel/root-cert.pem
        mode: '0644'

    # ztunnel re-reads this file on every request, so replacing it is enough to
    # rotate the token; the container does not need restarting.
    - name: Deploy service account token
      ansible.builtin.copy:
        src: "{{ work_dir }}/istio-token"
        dest: /etc/ztunnel/istio-token
        mode: '0600'

    # -------------------------------------------------------------------
    # 3. Run ztunnel
    # -------------------------------------------------------------------
    - name: Run the ztunnel container
      community.docker.docker_container:
        name: ztunnel
        image: "{{ ztunnel_image }}"
        pull: true
        state: started
        restart_policy: always
        network_mode: host
        capabilities:
          - NET_ADMIN
          - NET_RAW
        # The east-west gateway routes by SNI, so ztunnel must dial istiod by name.
        etc_hosts:
          istiod.istio-system.svc: "{{ ew_gateway_addr }}"
        # Mount the directory rather than the files so in-place token rotation is
        # visible. Z applies the SELinux label the container needs on RHEL.
        volumes:
          - /etc/ztunnel:/etc/ztunnel:ro,Z
        env:
          PROXY_MODE: dedicated
          PROXY_WORKLOAD_INFO: "{{ ztunnel_namespace }}/{{ ztunnel_workload_name }}/{{ ztunnel_service_account }}"
          XDS_ADDRESS: https://istiod.istio-system.svc:15012
          CA_ADDRESS: https://istiod.istio-system.svc:15012
          XDS_ROOT_CA: /etc/ztunnel/root-cert.pem
          CA_ROOT_CA: /etc/ztunnel/root-cert.pem
          AUTH_TOKEN: /etc/ztunnel/istio-token
          CLUSTER_ID: "{{ ztunnel_cluster_id }}"
          NETWORK: "{{ ztunnel_network }}"
          POD_NAMESPACE: "{{ ztunnel_namespace }}"
          POD_NAME: "{{ ztunnel_workload_name }}"
          INSTANCE_IP: "{{ vm_ip }}"
          RUST_LOG: info
        # NODE_NAME is deliberately unset: a WorkloadEntry has no node, and ztunnel
        # only indexes node-local workloads by identity unless NODE_NAME is absent.

    # -------------------------------------------------------------------
    # 4. Verification
    # -------------------------------------------------------------------
    - name: Wait for ztunnel to become ready
      ansible.builtin.uri:
        url: http://127.0.0.1:15021/healthz/ready
        status_code: 200
      register: ztunnel_ready
      retries: 30
      delay: 2
      until: ztunnel_ready is succeeded
