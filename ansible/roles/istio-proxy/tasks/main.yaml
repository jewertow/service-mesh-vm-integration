---
- name: Check the subscription-manager registration status
  ansible.builtin.command: subscription-manager identity
  register: istio_proxy_rhsm_identity
  changed_when: false
  failed_when: false

- name: Register the system with Red Hat Subscription Management
  ansible.builtin.command: >
    subscription-manager register
    --username {{ istio_proxy_rhsm_username }}
    --password {{ istio_proxy_rhsm_password }}
  when:
  - istio_proxy_rhsm_identity.rc != 0
  - istio_proxy_rhsm_username | length > 0
  no_log: true

- name: List the enabled subscription-manager repositories
  ansible.builtin.command: subscription-manager repos --list-enabled
  register: istio_proxy_enabled_repos
  changed_when: false

- name: Enable the repository providing the istio-proxy package
  ansible.builtin.command: subscription-manager repos --enable {{ istio_proxy_repo }}
  when: istio_proxy_repo not in istio_proxy_enabled_repos.stdout

- name: Install istio-proxy package
  ansible.builtin.package:
    name: istio-proxy
    state: present

# This is a workaround - the secrets directory should be managed by the RPM
- name: Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
  - /var/run/secrets/tokens

- name: Deploy Root Certificate
  ansible.builtin.copy:
    src: "{{ istio_proxy_config_dir }}/root-cert.pem"
    dest: /etc/certs/root-cert.pem
    mode: '0644'

- name: Deploy Istio Token
  ansible.builtin.copy:
    src: "{{ istio_proxy_config_dir }}/istio-token"
    dest: /var/run/secrets/tokens/istio-token
    mode: '0600'

- name: Deploy cluster.env configuration
  ansible.builtin.copy:
    src: "{{ istio_proxy_config_dir }}/cluster.env"
    dest: /var/lib/istio/envoy/cluster.env
    mode: '0644'

- name: Deploy mesh.yaml configuration
  ansible.builtin.copy:
    src: "{{ istio_proxy_config_dir }}/mesh.yaml"
    dest: /etc/istio/config/mesh
    mode: '0644'

# This is a workaround - the secrets directory should be managed by the RPM
- name: Set ownership for Istio directories and files
  ansible.builtin.file:
    path: "{{ item }}"
    owner: istio-proxy
    recurse: true
  loop:
  - /var/run/secrets

- name: Enable and start istio-proxy service
  ansible.builtin.systemd:
    name: istio-proxy
    state: started
    enabled: true
